name: Build Hermes Desktop Windows Portable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        default: 'v3.2.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Portable
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Exclude Defender Paths
        shell: powershell
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "Disabled Realtime Monitoring and added Defender exclusions."
          } catch {
            Write-Host "Defender exclusion notice: $($_.Exception.Message)"
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up PM toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          archive-inputs: false
          cache: true
          save-tools-cache: true

      - name: Install Windows bundle tooling
        run: |
          npm ci --workspace apps/desktop --include-workspace-root --include=dev --ignore-scripts --no-audit --no-fund

      - name: Build Bundled Portable Executable
        shell: powershell
        env:
          PYTHONUTF8: '1'
          HERMES_DESKTOP_VARIANT: 'bundled'
          HERMES_WIN_TARGET: 'zip,nsis'
          HERMES_OFFLINE: '1'
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Host "Admitted revision: $sha"
          
          # Clean git status check required by require_source
          git status
          
          python scripts/bundles/desktop.py --commit $sha --variant bundled --clean

      - name: Verify and list output artifacts
        shell: powershell
        run: |
          Get-ChildItem -Path "apps/desktop/release" -Recurse | ForEach-Object {
            Write-Host "$($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)"
          }
          # Normalize names
          $zip = Get-ChildItem -Path "apps/desktop/release" -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            $zipTarget = "apps/desktop/release/Hermes-Agent-3.2.0-win-x64-Portable.zip"
            if ($zip.FullName -ne (Resolve-Path $zipTarget -ErrorAction SilentlyContinue)) {
              Move-Item -Path $zip.FullName -Destination $zipTarget -Force
              Write-Host "Normalized zip artifact to: $zipTarget"
            }
          }
          $nsis = Get-ChildItem -Path "apps/desktop/release" -Filter "*.exe" | Select-Object -First 1
          if ($nsis) {
            $nsisTarget = "apps/desktop/release/Hermes-Agent-Setup-3.2.0-win-x64.exe"
            if ($nsis.FullName -ne (Resolve-Path $nsisTarget -ErrorAction SilentlyContinue)) {
              Move-Item -Path $nsis.FullName -Destination $nsisTarget -Force
              Write-Host "Normalized nsis installer to: $nsisTarget"
            }
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Agent-3.2.0-win-x64-Packages
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ always() }}
        with:
          tag_name: ${{ github.event.inputs.tag || 'v3.2.0' }}
          name: "Hermes Agent Desktop v3.2.0 (Windows 纯离线安装版 & 免安装绿色版)"
          body: |
            ### Hermes Desktop Windows 纯离线客户端
            提供两种无网部署形式，均已打包完整离线运行时（Python 解释器、全量依赖库、内置终端）：

            1. **`Hermes-Agent-3.2.0-win-x64-Portable.zip` (强烈推荐：真正免安装绿色版)**
               - 解压到任意目录（如 `D:\Hermes` 或 U 盘）即可直接双击 `Hermes.exe` 启动。
               - **秒开窗口**，避免单文件 exe 每次开机静默往临时目录解压 5GB 文件的卡顿与巨量磁盘 I/O。
            
            2. **`Hermes-Agent-Setup-3.2.0-win-x64.exe` (离线安装包)**
               - 包含解压进度提示的安装程序，安装后可在开始菜单和桌面生成快捷方式。
          files: |
            apps/desktop/release/Hermes-Agent-3.2.0-win-x64-Portable.zip
            apps/desktop/release/Hermes-Agent-Setup-3.2.0-win-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
